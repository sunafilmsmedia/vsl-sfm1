<body>

  <section class="lp-rvvideo">

  <!-- CALENDRIER -->
  <section class="lp-booking" id="booking">

        <div class="lp-booking__calendar is-unlocked">
          <iframe
            id="ghlBooking"
            src="https://api.leadconnectorhq.com/widget/booking/SUZpHLDFesSyKJdqzXlI"
            title="Calendrier de réservation"
            style="width:100%;border:none;overflow:hidden;"
            scrolling="no"
            width="100%" height="720"></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- Pré-remplit le widget GHL avec les infos de la page principale -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var iframe = document.getElementById('ghlBooking');
        if (!iframe) return;
        var name = (p.get('name') || '').trim();
        var parts = name.split(/\s+/);
        var first = parts.shift() || '';
        var last = parts.join(' ');
        var qs = [];
        if (first) qs.push('first_name=' + encodeURIComponent(first));
        if (last)  qs.push('last_name=' + encodeURIComponent(last));
        if (p.get('email')) qs.push('email=' + encodeURIComponent(p.get('email')));
        if (p.get('phone')) qs.push('phone=' + encodeURIComponent(p.get('phone')));
        if (qs.length) {
          iframe.src = 'https://api.leadconnectorhq.com/widget/booking/SUZpHLDFesSyKJdqzXlI?' + qs.join('&');
        }
      } catch (e) { /* best-effort */ }
    })();
  </script>

  <!-- FOOTER -->
  <footer class="lp-footer">

  <!-- Script d'embed GoHighLevel (resize auto) -->
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>

  <!-- RDV confirmé → pixel Schedule -->
  <script>
    (function () {
      var fired = false;
      window.addEventListener('message', function (e) {
        if (fired) return;
        var origin = e.origin || '';
        if (!/leadconnectorhq\.com|msgsndr\.com|gohighlevel\.com/i.test(origin)) return;
        var raw = '';
        try { raw = typeof e.data === 'string' ? e.data : JSON.stringify(e.data || ''); } catch (x) {}
        if (/height|resize|setheight/i.test(raw) && !/appoint|book|schedul|confirm/i.test(raw)) return;
        if (/appointment.?booked|booking.?(success|complete|confirmed)|schedul|slotbooked/i.test(raw)) {
          fired = true;
          if (typeof fbq !== 'undefined') fbq('track', 'Schedule');
          if (typeof clarity !== 'undefined') { try { clarity('event', 'booking_scheduled'); } catch (x) {} }
        }
      });
    })();
  </script>

  <!-- VSL autoplay muet → bouton pour activer le son -->
  <script>
    (function () {
      var btn = document.getElementById('unmuteBtn');
      var iframe = document.getElementById('vslPlayer');
      if (!btn || !iframe) return;
      var player = null;
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = function () {
        try { player = new YT.Player('vslPlayer'); } catch (e) {}
      };
      btn.addEventListener('click', function () {
        var done = false;
        if (player && typeof player.unMute === 'function') {
          try { player.unMute(); player.setVolume(100); player.playVideo(); done = true; } catch (e) {}
        }
        if (!done) {
          iframe.src = 'https://www.youtube.com/embed/yNBzXR0RrMQ?autoplay=1&mute=0&rel=0&modestbranding=1&playsinline=1&controls=1&enablejsapi=1';
        }
        btn.classList.add('is-hidden');
        if (typeof fbq !== 'undefined') fbq('trackCustom', 'VideoUnmute');
      });
    })();
  </script>
